*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef0f4;color:#111827;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/*  Navbar  */
.hb-nav{height:50px;background:#1e293b;color:#f1f5f9;display:flex;align-items:center;padding:0 16px;flex-shrink:0;z-index:200;gap:12px}
.hb-nav-left{min-width:160px;display:flex;align-items:center;gap:8px}
.hb-nav-logo{color:#64748b;flex-shrink:0}
.hb-nav-title{flex:1;display:flex;align-items:center;justify-content:center}
.hb-project-name{font-weight:600;font-size:13px;color:#f1f5f9;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}
.hb-nav-right{min-width:160px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.hb-nav-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;font-size:11px;font-weight:500;text-decoration:none;transition:all .15s;white-space:nowrap}
.hb-nav-pill:hover{background:rgba(255,255,255,0.12);color:#f1f5f9}
.hb-nav-pill i{font-size:10px}
.hb-nav-meta{font-size:11px;color:#475569;display:flex;align-items:center;gap:4px;white-space:nowrap}
.hb-nav-meta i{font-size:10px}
.hb-pwa-badge{background:rgba(134,239,172,0.1);border:1px solid rgba(134,239,172,0.2);color:#86efac;padding:3px 8px;border-radius:5px;font-weight:600;font-size:10px}

/*  App shell  */
.hb-app{flex:1;display:flex;overflow:hidden;min-height:0;flex-grow:1;}

/*  Grid layouts  */
.hb-grid{flex:1;display:grid;gap:8px;padding:10px;min-height:0;min-width:0;overflow:hidden;align-items:stretch;justify-items:stretch;}
.hb-grid-single{grid-template-columns:1fr;grid-template-rows:1fr}
.hb-grid-cols2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.hb-grid-rows2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.hb-grid-win3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.hb-grid-win3 > #panel-0{grid-row:1 / span 2}
.hb-grid-grid4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

/*  Panel  */
.hb-panel{background:#fff;border:1px solid #e2e8f0;border-top:2px solid #334155;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;box-shadow:0 1px 6px rgba(0,0,0,0.05);flex-grow:1;}
.hb-panel-toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f8fafc;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.hb-node-select{flex:1;font-size:11px;padding:4px 7px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;color:#374151;outline:none;font-family:inherit;cursor:pointer;font-weight:500}
.hb-node-select:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,0.1)}
.hb-view-btns{display:flex;gap:2px}
.hb-view-btn{width:26px;height:26px;border-radius:5px;border:1px solid #e5e7eb;background:transparent;color:#9ca3af;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .1s}
.hb-view-btn:hover{background:#f1f5f9;color:#334155}
.hb-view-btn.active{background:#334155;border-color:#334155;color:#fff}
.hb-panel-content{flex:1;overflow:hidden;min-height:0;min-width:0;position:relative;display:flex;flex-direction:column;}

/*  Empty state  */
.hb-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:#d1d5db}
.hb-empty i{font-size:28px;color:#e5e7eb}
.hb-empty span{font-size:12px;font-weight:500;color:#9ca3af}

/*  Table  */
.hb-table-wrap{height:100%;overflow:auto;padding:12px}
table.hb-table{width:100%;border-collapse:collapse;font-size:12px}
.hb-table th{background:#f8fafc;border-bottom:2px solid #e5e7eb;padding:7px 10px;text-align:left;font-weight:700;color:#374151;cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:1;font-size:11px}
.hb-table th:hover{background:#f1f5f9;color:#1e293b}
.hb-table td{padding:5px 10px;border-bottom:1px solid #f3f4f6;color:#374151;font-size:12px}
.hb-table tr:nth-child(even) td{background:#fafafa}
.hb-table tr:hover td{background:#eff6ff}

/*  JSON Tree Explorer  */
.hb-json-wrap{height:100%;overflow:auto;padding:12px;font-family:'SF Mono',ui-monospace,Consolas,monospace;font-size:11px;line-height:1.7}
.hb-json-node{padding-left:16px;border-left:1px solid #f3f4f6;margin:1px 0}
.hb-json-toggle{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;padding:1px 3px;border-radius:3px;transition:background .1s}
.hb-json-toggle:hover{background:#f3f4f6}
.hb-json-toggle i{font-size:8px;color:#94a3b8;width:10px}
.hb-json-key{color:#7c3aed;font-weight:600}
.hb-json-colon{color:#94a3b8;margin:0 3px}
.hb-json-str{color:#059669}
.hb-json-num{color:#0891b2}
.hb-json-bool{color:#d97706;font-weight:600}
.hb-json-null{color:#94a3b8;font-style:italic}
.hb-json-collapsed{display:none}
.hb-json-summary{color:#94a3b8;font-size:10px;font-style:italic;margin-left:4px}
.hb-json-page-btn{padding:2px 8px;font-size:10px;cursor:pointer;background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;color:#334155;transition:all .1s}
.hb-json-page-btn:hover:not(:disabled){background:#f1f5f9;border-color:#cbd5e1}
.hb-json-page-btn:disabled{opacity:0.5;cursor:not-allowed}
.hb-json-checkbox{margin-right:4px;margin-left:4px;cursor:pointer;accent-color:#3b82f6}

/*  Inspector sidebar  */
.hb-inspector{width:224px;flex-shrink:0;border-left:1px solid #e2e8f0;background:#fafbfc;display:flex;flex-direction:column;overflow:hidden}
.hb-inspector-header{padding:9px 12px;font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #f3f4f6;flex-shrink:0;display:flex;align-items:center;gap:6px;background:#f8fafc}
.hb-inspector-header i{font-size:11px;color:#94a3b8}
.hb-inspector-meta{margin-left:auto;font-size:9px;background:#e5e7eb;padding:1px 6px;border-radius:9px;color:#6b7280;font-weight:600;text-transform:none;letter-spacing:0}
.hb-inspector-foot{padding:8px 12px;font-size:10px;color:#94a3b8;border-top:1px solid #f3f4f6;text-align:center;flex-shrink:0}
.hb-node-list{flex:1;overflow-y:auto;padding:6px 8px}
.hb-node-item{padding:8px 10px;border-radius:6px;border:1px solid transparent;margin-bottom:3px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s;background:transparent}
.hb-node-item:hover{background:#fff;border-color:#e5e7eb}
.hb-node-item.active{background:#fff;border-color:#e2e8f0;border-left:3px solid #334155;padding-left:8px}
.hb-node-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.hb-node-name{font-weight:600;font-size:11px;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hb-node-type{font-size:9px;color:#9ca3af;font-weight:500}

const NODES    = [{"id":"node-nasa-precip","name":"NASA_POWER_DAILY_PRECIP","type":"data"},{"id":"node-usgs-flow","name":"USGS_DAILY_FLOW","type":"data"},{"id":"node-parse-precip","name":"PARSE_NASA_PRECIP","type":"code","analyticalCode":"if (!data) return [];\nconst raw = typeof data === 'string' ? JSON.parse(data) : data;\nconst params = raw?.properties?.parameter ?? raw?.parameter ?? {};\nconst P = params.PRECTOTCORR ?? params.PRECTOT ?? {};\nconst T = params.T2M ?? {};\nconst SW = params.ALLSKY_SFC_SW_DWN ?? {};\nreturn Object.keys(P)\n  .map(dt => ({\n    date: `${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,\n    precip_mm: Math.max(0, parseFloat(P[dt]) || 0),\n    T2M: parseFloat(T[dt]) || 0,\n    Solar_Rad: parseFloat(SW[dt]) || 0\n  }))\n  .filter(r => r.date.length === 10)\n  .sort((a,b) => a.date.localeCompare(b.date));"},{"id":"node-parse-flow","name":"PARSE_USGS_FLOW","type":"code","analyticalCode":"if (!data) return [];\nconst raw = typeof data === 'string' ? JSON.parse(data) : data;\nconst ts = (raw?.value?.timeSeries ?? raw?.timeSeries ?? [])[0];\nif (!ts) return [];\nconst vals = ts?.values?.[0]?.value ?? [];\nreturn vals\n  .map(v => ({ date: v.dateTime?.slice(0,10), Q_cms: parseFloat(v.value)*0.0283168 }))\n  .filter(r => !isNaN(r.Q_cms) && r.Q_cms >= 0)\n  .sort((a,b) => a.date.localeCompare(b.date));"},{"id":"node-lstm-train","name":"ANN_TRAIN_PREDICT","type":"code","analyticalCode":"import json, numpy as np, pandas as pd, math\nfrom sklearn.neural_network import MLPRegressor\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.metrics import mean_squared_error, r2_score\n\npdf = pd.DataFrame(json.loads(input_data[0]) if isinstance(input_data[0],str) else input_data[0])\nqdf = pd.DataFrame(json.loads(input_data[1]) if isinstance(input_data[1],str) else input_data[1])\ndf = pd.merge(pdf, qdf, on='date', how='inner').sort_values('date').reset_index(drop=True)\ndf = df.dropna(subset=['precip_mm','Q_cms'])\n\nif len(df) < 100:\n    return {'error': f'Insufficient merged input_"},{"id":"node-chart","name":"ANN_PREDICTION_CHART","type":"visualization","chartConfig":{"type":"line","title":"ANN Streamflow Forecast — Guadalupe River","xKey":"date","yLabel":"Streamflow (m³/s)","xLabel":"Date","series":[{"key":"observed","label":"Observed","color":"#2563eb","dashed":false},{"key":"predicted","label":"LSTM Pred","color":"#dc2626","dashed":true}],"selectedPaths":["comparison"]}},{"id":"node-metrics","name":"ANN_METRICS_TABLE","type":"visualization","tableConfig":{"title":"ANN Model Performance Metrics","selectedPaths":["R2_Score","KGE","RMSE_cms","PBIAS_pct","epochs_run"],"striped":"odd"}},{"id":"node-scatter","name":"ANN_SCATTER","type":"visualization","chartConfig":{"type":"scatter","title":"ANN Observed vs Predicted","xKey":"obs","yLabel":"Predicted Flow","xLabel":"Observed Flow","series":[{"key":"pred","label":"Predictions","color":"#14b8a6","dashed":false}],"selectedPaths":["scatter"]}},{"id":"node-hist","name":"ANN_RESIDUALS_HIST","type":"visualization","chartConfig":{"type":"bar","title":"Residual Distribution","xKey":"bin","yLabel":"Frequency","xLabel":"Error Bin","series":[{"key":"count","label":"Count","color":"#ef4444","dashed":false}],"selectedPaths":["histogram"]}}];

function renderGrid() {

    grid.appendChild(buildPanelEl(i, panel));
  });
  state.panels.forEach((panel, i) => {
    if (panel.nodeId) renderPanelContent(i, panel);
  });

function buildPanelEl(i, panel) {

  tb.className = 'hb-panel-toolbar';

  //  DataTree: recursive lazy tree matching main app DataExplorer 
  function buildDataTree(name, val, pathStr, selectedPaths, onToggle, depth) {
    depth = depth || 0;
    const isArr = Array.isArray(val);
    const isObj = val && typeof val === 'object' && !isArr;
    const canExpand = isArr || isObj;

    // Expand caret
