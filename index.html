function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexAlpha(c, alphaStr) {
  if (!c) return '#cbd5e1';
  if (c.startsWith('#')) return c + alphaStr;
  if (c.startsWith('rgb(')) return c.replace('rgb(', 'rgba(').replace(')', ', ' + (parseInt(alphaStr, 16)/255).toFixed(2) + ')');
  
  // If it's a named color or var(--), we can't easily add alpha string
  // Let Chart.js handle it, or we create a canvas wrapper, but returning the raw color is safest.
  // Actually, Chart.js supports arrays for opacity in some modes, but CSS color-mix is modern:
  if (c.startsWith('var(') || !c.startsWith('#')) {
    return `color-mix(in srgb, ${c} ${Math.floor((parseInt(alphaStr, 16)/255)*100)}%, transparent)`;
  }
  return c;
}

function buildAnimationPlayer(totalFrames, initialFrame, onFrame, frameLabels) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;align-items:center;gap:6px;padding:5px 10px;background:#f8fafc;border-top:1px solid #e5e7eb;flex-shrink:0;font-family:"Inter",sans-serif;font-size:10px;z-index:500;position:relative';
  let currentFrame = initialFrame;
  let playing = false;
  let fps = 4;
  let loop = false;
  let timeout = null;

  const lbl = document.createElement('span');
  lbl.style.cssText = 'font-weight:700;color:#475569;min-width:56px;text-align:center;background:#e2e8f0;border-radius:4px;padding:2px 6px;white-space:nowrap';

  const range = document.createElement('input');
  range.type = 'range'; range.min = 0; range.max = totalFrames - 1; range.step = 1; range.value = currentFrame;
  range.style.cssText = 'flex:1;cursor:pointer;accent-color:#3b82f6;min-width:60px';

  const btnPlay = document.createElement('button');

  const updateUI = () => {
    range.value = currentFrame;
    const label = (frameLabels && frameLabels[currentFrame]) ? frameLabels[currentFrame] : (currentFrame + 1);
    lbl.textContent = label + ' / ' + totalFrames;
    btnPlay.innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
    btnPlay.style.background = playing ? '#334155' : '#fff';
    btnPlay.style.color = playing ? '#fff' : '#374151';
  };

  const stop = () => {
    if (timeout) clearTimeout(timeout);
    timeout = null;
    playing = false;
    updateUI();
  };

  const play = () => {
    if (timeout) clearTimeout(timeout);
    playing = true;
    updateUI();
    const loopStep = async () => {
      if (!playing) return;
      let next = currentFrame + 1;
      if (next >= totalFrames) {
        if (!loop) { stop(); return; }
        next = 0;
      }
      await setFrame(next);
      if (playing) {
        timeout = setTimeout(loopStep, 1000 / fps);
      }
    };
    timeout = setTimeout(loopStep, 1000 / fps);
  };

  let _busy = false;
  const setFrame = async (f) => {
    currentFrame = Math.max(0, Math.min(totalFrames - 1, f));
    updateUI();
    if (_busy) return; // discard rapid clicks — active frame load still in progress
    _busy = true;
    try {
      if (onFrame) {
        const result = onFrame(currentFrame);
        if (result instanceof Promise) await result;
      }
    } finally {
      _busy = false;
    }
  };

  const mkBtn = (html, onClick, btnEl=null) => {
    const b = btnEl || document.createElement('button');
    b.innerHTML = html;
    b.style.cssText = 'display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;border:1px solid #e2e8f0;background:#fff;color:#374151;cursor:pointer;font-size:10px;flex-shrink:0;transition:all 0.1s';
    b.onclick = onClick;
    return b;
  };

  const btnFirst = mkBtn('<i class="fas fa-step-backward"></i>', () => { stop(); setFrame(0); });
  const btnPrev = mkBtn('<i class="fas fa-step-backward fa-rotate-90" style="transform:scaleX(-1) rotate(90deg)"></i>', () => { stop(); setFrame(currentFrame - 1); });
  mkBtn('', () => { if (playing) stop(); else play(); }, btnPlay);
  const btnNext = mkBtn('<i class="fas fa-step-forward fa-rotate-90" style="transform:rotate(90deg)"></i>', () => { stop(); setFrame(currentFrame + 1); });
  const btnLast = mkBtn('<i class="fas fa-step-forward"></i>', () => { stop(); setFrame(totalFrames - 1); });

  range.oninput = (e) => { stop(); setFrame(Number(e.target.value)); };

  const fpsLbl = document.createElement('span');
  fpsLbl.textContent = 'FPS:'; fpsLbl.style.cssText = 'color:#94a3b8;font-weight:600';
  const fpsRange = document.createElement('input');
  fpsRange.type = 'range'; fpsRange.min = 1; fpsRange.max = 30; fpsRange.step = 1; fpsRange.value = fps;
  fpsRange.style.cssText = 'width:50px;cursor:pointer;accent-color:#10b981';
  const fpsVal = document.createElement('span');
  fpsVal.textContent = fps; fpsVal.style.cssText = 'font-weight:700;color:#374151;min-width:16px';
  fpsRange.oninput = (e) => {
    fps = Number(e.target.value);
    fpsVal.textContent = fps;
    if (playing) play();
  };

  const btnLoop = mkBtn('<i class="fas fa-redo"></i>', () => {
    loop = !loop;
    btnLoop.style.background = loop ? '#334155' : '#fff';
    btnLoop.style.color = loop ? '#fff' : '#374151';
  });

  wrap.appendChild(btnFirst); wrap.appendChild(btnPrev); wrap.appendChild(btnPlay); wrap.appendChild(btnNext); wrap.appendChild(btnLast);
  wrap.appendChild(range); wrap.appendChild(lbl);
  wrap.appendChild(fpsLbl); wrap.appendChild(fpsRange); wrap.appendChild(fpsVal); wrap.appendChild(btnLoop);
  
  updateUI();
  return { el: wrap, stop, setFrame };
}

function safeMinMax(gr) {
  const noD = gr.noDataValue;
  const band = gr.values?.[0];
  if (band) {
    const is2D = typeof band[0] !== "number";
    let lo = Infinity, hi = -Infinity;
    if (is2D) {
      const nR = band.length;
      const nC = band[0]?.length ?? 0;
      const rS = Math.max(1, Math.floor(nR / 100));
      const cS = Math.max(1, Math.floor(nC / 100));
      for (let r = 0; r < nR; r += rS) {
        const row = band[r];
        for (let c = 0; c < nC; c += cS) {
          const v = row[c];
          if (!isFinite(v) || v <= -900 || (noD != null && v === noD)) continue;
          if (v < lo) lo = v; if (v > hi) hi = v;
        }
      }
    } else {
      const len = band.length;
      const step = Math.max(1, Math.floor(len / 10000));
      for (let i = 0; i < len; i += step) {
        const v = band[i];
        if (!isFinite(v) || v <= -900 || (noD != null && v === noD)) continue;
        if (v < lo) lo = v; if (v > hi) hi = v;
      }
    }
    if (lo < hi) return { min: lo, max: hi };
  }
  const fallMin = gr.mins?.[0] ?? 0;
  const fallMax = gr.maxs?.[0] ?? 1;
  return { min: fallMin <= -900 ? 0 : fallMin, max: fallMax };
}

function getPaletteGradient(palette) {
  switch (palette) {
    case "ocean": return "linear-gradient(to right, rgb(0, 30, 100), rgb(0, 76, 255))";
    case "grayscale": return "linear-gradient(to right, rgb(0,0,0), rgb(255,255,255))";
    case "hsv": return "linear-gradient(to right, hsl(0,100%,50%), hsl(60,100%,50%), hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%), hsl(300,100%,50%), hsl(360,100%,50%))";
    case "terrain": return "linear-gradient(to right, rgba(59,130,246,0.8) 0%, rgba(59,130,246,0.8) 25%, rgba(34,197,94,0.8) 25%, rgba(34,197,94,0.8) 50%, rgba(217,119,6,0.8) 50%, rgba(217,119,6,0.8) 75%, rgba(241,245,249,0.9) 75%, rgba(241,245,249,0.9) 100%)";
    case "plasma": return "linear-gradient(to right, rgba(13,8,135,0.85), rgba(126,3,168,0.85), rgba(204,71,120,0.85), rgba(248,149,64,0.85), rgba(240,249,33,0.85))";
    case "magma": return "linear-gradient(to right, rgba(0,0,100,0.85), rgba(81,18,124,0.85), rgba(182,54,121,0.85), rgba(251,136,97,0.85), rgba(252,253,191,0.85))";
    case "viridis":
    default: return "linear-gradient(to right, rgba(68,1,84,0.85), rgba(59,82,139,0.85), rgba(33,145,140,0.85), rgba(94,201,98,0.85), rgba(253,231,37,0.85))";
  }
}
